spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/todo_db}
spring.datasource.driverClassName=${DB_DRIVER:org.postgresql.Driver}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.datasource.username=${DB_USER:todo}
spring.datasource.password=${DB_PASSWORD:todo123}
# Flyway configuration: use db/migration for migration scripts
spring.flyway.locations=classpath:/db/migration
spring.jpa.hibernate.ddl-auto=validate
# Database configuration (PostgreSQL)
# JWT settings
todo.security.jwt.secret=${JWT_SECRET:spring-boot-starter-security-jwt-secret-key-that-is-at-least-64-bytes-long}
todo.security.jwt.expiration-ms=3600000
todo.security.jwt.refresh-expiration-ms=2592000000
